name: RPC Track
description: JSON-RPC / OpenRPC data collection, methods, or operations
labels: ["track:rpc"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done?
    validations:
      required: true
  - type: input
    id: chain
    attributes:
      label: Chain / Network
      placeholder: e.g. Ethereum, Arbitrum, Base
    validations:
      required: false